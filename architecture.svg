<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#2dd4bf"/>
    </linearGradient>

    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0ea5e9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>

    <!-- Drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" fill="url(#bgGrad)" rx="20"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="170" x2="1100" y2="170"/>
    <line x1="0" y1="340" x2="1100" y2="340"/>
    <line x1="0" y1="510" x2="1100" y2="510"/>
    <line x1="275" y1="0" x2="275" y2="680"/>
    <line x1="550" y1="0" x2="550" y2="680"/>
    <line x1="825" y1="0" x2="825" y2="680"/>
  </g>

  <!-- ── Title ── -->
  <text x="550" y="46" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="white">⚡ Data Sync Pipeline — Architecture</text>
  <text x="550" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Multi-source ETL · FastAPI · Prefect · PostgreSQL · Streamlit · Docker</text>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- COLUMN 1: DATA SOURCES -->
  <!-- ════════════════════════════════════════════════════ -->

  <!-- Section label -->
  <rect x="30" y="90" width="200" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="130" y="108" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">DATA SOURCES</text>

  <!-- REST API Source -->
  <rect x="30" y="130" width="200" height="100" rx="14" fill="#0c1a2e" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="130" width="200" height="5" rx="3" fill="url(#blueGrad)"/>
  <text x="130" y="165" text-anchor="middle" font-family="Inter, sans-serif" font-size="22">🌐</text>
  <text x="130" y="188" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="white">REST API</text>
  <text x="130" y="206" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">JSONPlaceholder · HTTP/JSON</text>
  <text x="130" y="221" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#0ea5e9">httpx · async</text>

  <!-- CSV Source -->
  <rect x="30" y="255" width="200" height="100" rx="14" fill="#0c1a2e" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="255" width="200" height="5" rx="3" fill="url(#greenGrad)"/>
  <text x="130" y="290" text-anchor="middle" font-family="Inter, sans-serif" font-size="22">📄</text>
  <text x="130" y="313" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="white">CSV Files</text>
  <text x="130" y="331" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Local file system</text>
  <text x="130" y="346" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#10b981">pandas · csv</text>

  <!-- Webhook Source -->
  <rect x="30" y="380" width="200" height="100" rx="14" fill="#0c1a2e" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="380" width="200" height="5" rx="3" fill="url(#orangeGrad)"/>
  <text x="130" y="415" text-anchor="middle" font-family="Inter, sans-serif" font-size="22">🔔</text>
  <text x="130" y="438" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="white">Webhooks</text>
  <text x="130" y="456" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Inbound HTTP POST events</text>
  <text x="130" y="471" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#f59e0b">FastAPI · port 8000</text>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- COLUMN 2: ETL PIPELINE (PREFECT) -->
  <!-- ════════════════════════════════════════════════════ -->

  <!-- Section label -->
  <rect x="265" y="90" width="200" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="365" y="108" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">ETL PIPELINE</text>

  <!-- Prefect wrapper -->
  <rect x="255" y="125" width="220" height="370" rx="16" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
  <rect x="285" y="112" width="80" height="20" rx="5" fill="#1e293b"/>
  <text x="325" y="126" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#6366f1">⚙ Prefect</text>

  <!-- Extract -->
  <rect x="270" y="140" width="190" height="88" rx="12" fill="#0c1a2e" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="270" y="140" width="190" height="4" rx="2" fill="url(#blueGrad)"/>
  <text x="365" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="18">⬇</text>
  <text x="365" y="192" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="white">Extract</text>
  <text x="365" y="210" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">api_extractor · csv_extractor</text>
  <text x="365" y="224" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">webhook_extractor</text>

  <!-- Arrow Extract → Transform -->
  <line x1="365" y1="228" x2="365" y2="263" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Transform -->
  <rect x="270" y="268" width="190" height="80" rx="12" fill="#0c1a2e" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="270" y="268" width="190" height="4" rx="2" fill="url(#purpleGrad)"/>
  <text x="365" y="296" text-anchor="middle" font-family="Inter, sans-serif" font-size="18">⚙</text>
  <text x="365" y="318" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="white">Transform</text>
  <text x="365" y="336" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Normalize · Deduplicate · Validate</text>

  <!-- Arrow Transform → Load -->
  <line x1="365" y1="348" x2="365" y2="383" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Load -->
  <rect x="270" y="388" width="190" height="80" rx="12" fill="#0c1a2e" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="270" y="388" width="190" height="4" rx="2" fill="url(#greenGrad)"/>
  <text x="365" y="416" text-anchor="middle" font-family="Inter, sans-serif" font-size="18">⬆</text>
  <text x="365" y="438" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="white">Load</text>
  <text x="365" y="456" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Upsert · SQLAlchemy ORM</text>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- COLUMN 3: DATABASE -->
  <!-- ════════════════════════════════════════════════════ -->

  <!-- Section label -->
  <rect x="520" y="90" width="200" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="620" y="108" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">DATABASE</text>

  <!-- PostgreSQL -->
  <rect x="510" y="130" width="220" height="280" rx="16" fill="#0c1a2e" stroke="#14b8a6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="510" y="130" width="220" height="6" rx="3" fill="url(#tealGrad)"/>
  <text x="620" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="28">🐘</text>
  <text x="620" y="195" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white">PostgreSQL 15</text>
  <text x="620" y="214" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Alpine · port 5432</text>

  <!-- Table: synced_records -->
  <rect x="530" y="228" width="180" height="46" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1"/>
  <text x="620" y="248" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0ea5e9">synced_records</text>
  <text x="620" y="265" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#64748b">id · source · title · value · synced_at</text>

  <!-- Table: sync_runs -->
  <rect x="530" y="284" width="180" height="46" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
  <text x="620" y="304" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#6366f1">sync_runs</text>
  <text x="620" y="321" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#64748b">status · extracted · loaded · started_at</text>

  <!-- Table: webhook_events -->
  <rect x="530" y="340" width="180" height="46" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="620" y="360" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#f59e0b">webhook_events</text>
  <text x="620" y="377" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#64748b">payload · status · received_at</text>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- COLUMN 4: MONITORING -->
  <!-- ════════════════════════════════════════════════════ -->

  <!-- Section label -->
  <rect x="775" y="90" width="200" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="875" y="108" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">MONITORING</text>

  <!-- Streamlit Dashboard -->
  <rect x="770" y="130" width="300" height="200" rx="16" fill="#0c1a2e" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="770" y="130" width="300" height="6" rx="3" fill="url(#pinkGrad)"/>
  <text x="920" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="24">📊</text>
  <text x="920" y="192" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white">Streamlit Dashboard</text>
  <text x="920" y="212" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">port 8501 · auto-refresh 30s</text>

  <!-- Feature bullets -->
  <text x="790" y="236" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">✦  KPI metrics (records, sources, success rate)</text>
  <text x="790" y="253" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">✦  Interactive Plotly charts (pie, bar, timeline)</text>
  <text x="790" y="270" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">✦  Run history with status badges</text>
  <text x="790" y="287" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">✦  Webhook events monitor</text>
  <text x="790" y="304" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">✦  Multi-page navigation sidebar</text>

  <!-- Webhook Server -->
  <rect x="770" y="350" width="300" height="100" rx="16" fill="#0c1a2e" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="770" y="350" width="300" height="6" rx="3" fill="url(#orangeGrad)"/>
  <text x="920" y="382" text-anchor="middle" font-family="Inter, sans-serif" font-size="24">⚡</text>
  <text x="920" y="404" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white">FastAPI Webhook Server</text>
  <text x="920" y="424" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">POST /webhook/{source}  ·  port 8000</text>
  <text x="920" y="440" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#f59e0b">Async · Uvicorn · Auto-reload</text>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- DOCKER LABEL -->
  <!-- ════════════════════════════════════════════════════ -->
  <rect x="30" y="502" width="1040" height="120" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8,5"/>
  <rect x="55" y="492" width="100" height="22" rx="6" fill="#1e293b"/>
  <text x="105" y="507" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">🐳 Docker</text>

  <!-- Stack pills -->
  <rect x="60" y="518" width="110" height="32" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="1"/>
  <text x="115" y="539" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#0ea5e9">Python 3.11-slim</text>

  <rect x="190" y="518" width="110" height="32" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
  <text x="245" y="539" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6366f1">Prefect 3.x</text>

  <rect x="320" y="518" width="110" height="32" rx="10" fill="#1e293b" stroke="#14b8a6" stroke-width="1"/>
  <text x="375" y="539" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#14b8a6">PostgreSQL 15</text>

  <rect x="450" y="518" width="110" height="32" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
  <text x="505" y="539" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#ec4899">Streamlit 1.33</text>

  <rect x="580" y="518" width="110" height="32" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="635" y="539" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#f59e0b">FastAPI 0.110</text>

  <rect x="710" y="518" width="110" height="32" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="765" y="539" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#10b981">SQLAlchemy 2</text>

  <rect x="840" y="518" width="110" height="32" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
  <text x="895" y="539" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#818cf8">Pandas 2.x</text>

  <rect x="970" y="518" width="80" height="32" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1"/>
  <text x="1010" y="539" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">Plotly 5</text>

  <!-- Docker compose note -->
  <text x="550" y="580" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#475569">All services orchestrated via docker-compose.yml with health checks and volume persistence</text>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- ARROWS between columns -->
  <!-- ════════════════════════════════════════════════════ -->

  <!-- REST API → Extract -->
  <line x1="230" y1="178" x2="268" y2="178" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>

  <!-- CSV → Extract -->
  <line x1="230" y1="303" x2="248" y2="200" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Webhook → FastAPI → Extract (via webhook server) -->
  <line x1="230" y1="428" x2="248" y2="218" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Load → PostgreSQL -->
  <line x1="460" y1="428" x2="508" y2="340" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- PostgreSQL → Dashboard -->
  <line x1="730" y1="250" x2="768" y2="220" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PostgreSQL → FastAPI (reads webhook_events) -->
  <line x1="730" y1="360" x2="768" y2="400" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- Footer -->
  <!-- ════════════════════════════════════════════════════ -->
  <text x="550" y="660" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#334155">github.com/farahioussama01/data-sync-pipeline</text>
</svg>
